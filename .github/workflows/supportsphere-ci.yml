name: SupportSphere CI
on:
  push:
    paths:
      - 'portfolio-projects/supportsphere-helpdesk/**'
      - '.github/workflows/supportsphere-ci.yml'
  pull_request:
    paths:
      - 'portfolio-projects/supportsphere-helpdesk/**'
      - '.github/workflows/supportsphere-ci.yml'
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-projects/supportsphere-helpdesk/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-projects/supportsphere-helpdesk/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
